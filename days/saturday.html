<!DOCTYPE HTML>
<html>
<head>
	<title>egg ‧ 2027 — Saturday</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<style>
		body {
			margin: 0;
			padding: 0;
			background: #f2f5f3;
		}

		/* Top bar */
		.top-bar {
			position: sticky;
			top: 0;
			z-index: 100;
			background: #F4BB29;
			display: flex;
			align-items: center;
			padding: 0.75em 1.25em;
			gap: 1em;
		}

		.top-bar a.close {
			font-size: 1.5em;
			font-weight: 700;
			color: #000;
			text-decoration: none;
			line-height: 1;
			flex-shrink: 0;
		}

		.top-bar a.close:hover {
			color: #444;
		}

		.top-bar h1 {
			font-family: 'Ubuntu', sans-serif;
			font-weight: 700;
			font-size: 1.2em;
			color: #000;
			margin: 0;
			line-height: 1.2;
		}

		/* Table */
		.timetable-wrapper {
			overflow-x: auto;
			padding: 1.5em;
		}

		table.timetable {
			width: 100%;
			min-width: 480px;
			border-collapse: collapse;
		}

		table.timetable th,
		table.timetable td {
			border: 1px solid #555;
			padding: 0.55em 0.9em;
			font-size: 0.95em;
			text-align: left;
			color: #333;
		}

		table.timetable thead th {
			background: #3a3a3a;
			color: #fff;
			font-family: 'Open Sans Condensed', sans-serif;
			font-weight: 700;
			text-transform: uppercase;
		}

		table.timetable tbody tr:nth-child(odd)  { background: #f5f5f5; }
		table.timetable tbody tr:nth-child(even) { background: #ececec; }

		table.timetable td.time {
			font-weight: 700;
			white-space: nowrap;
			width: 5em;
		}
	</style>
</head>
<body>

	<!-- Yellow top bar -->
	<div class="top-bar">
		<a href="#" onclick="history.back(); return false;" class="close">✕</a>
		<h1>Saturday, 29th May 2027</h1>

				<tr><td class="time">15:00</td>	<td></td>	<td></td>	<td></td>	<td></td>	</tr>

</body>
</html>
